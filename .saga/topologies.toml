# Escapement cockpit topology: 6-slot cockpit-grid for unsigned-gg/ep.
# Slot 0: lead/type alchemist (gullveig), Slots 1-3: bounded builders (sindri, verdandi, dvalinn),
# Slot 4: specification architect (saga), Slot 5: adversarial critic (loki).
[topologies.ep-cockpit]
slots = [
  { role = "gullveig", label = "lead" },
  { role = "sindri", label = "worker-top" },
  { role = "verdandi", label = "worker-mid" },
  { role = "dvalinn", label = "worker-bottom" },
  { role = "saga", label = "architect" },
  { role = "loki", label = "critic" },
]
splits = [
  { from = 0, direction = "right", ratio = 0.3333333333333333, new = 1 },
  { from = 1, direction = "right", ratio = 0.5, new = 4 },
  { from = 1, direction = "down", ratio = 0.3333333333333333, new = 2 },
  { from = 2, direction = "down", ratio = 0.5, new = 3 },
  { from = 4, direction = "down", ratio = 0.5, new = 5 },
]
