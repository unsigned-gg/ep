# ep Workstation & CI Validation DAG for dagrun v0.15.0+
# Applies two-level cgroup-v2 containment, CPA moldable CPU width planning,
# rss_baseline_bytes memory admission, and cargo-target lock serialization on ceres.

version: 2

defaults:
  timeout: 600
  env:
    CARGO_BUILD_JOBS: "2"
    JOBS: "2"

resource_caps:
  cargo-target: 1

steps:
  - job: zero-io-domain
    group: hygiene
    desc: "Verify ep-domain zero-I/O leaf purity"
    cmd: "! grep -rnE 'std::net|std::fs|tokio|std::process' crates/ep-domain/src"
    cmdtype: unknown
    hint:
      est_duration_s: 0.2
      rss_baseline_bytes: 67108864
      hard_mem_max_bytes: 268435456

  - job: fmt-check
    group: rust
    desc: "Verify Rust workspace formatting"
    cmd: "cargo fmt --all -- --check"
    cmdtype: unknown
    hint:
      est_duration_s: 1.0
      rss_baseline_bytes: 268435456
      hard_mem_max_bytes: 1073741824

  - job: clippy
    group: rust
    desc: "Run workspace clippy with -D warnings (-j 2)"
    cmd: "cargo clippy --workspace -j 2 --all-targets -- -D warnings"
    cmdtype: cargo-build
    deps:
      - rust.fmt-check
      - hygiene.zero-io-domain
    hint:
      est_duration_s: 10.0
      rss_baseline_bytes: 1073741824
      hard_mem_max_bytes: 4294967296
      preferred_inner_jobs: 2
      resources:
        cargo-target: 1

  - job: test
    group: rust
    desc: "Run workspace unit and integration tests (-j 2)"
    cmd: "cargo test --workspace -j 2"
    cmdtype: cargo-test
    deps:
      - rust.clippy
    hint:
      est_duration_s: 8.0
      rss_baseline_bytes: 1073741824
      hard_mem_max_bytes: 4294967296
      preferred_inner_jobs: 2
      resources:
        cargo-target: 1
